name: CI

# Every push and pull request: format check, vet, tests and a build.
# A tag v* additionally publishes a GitHub Release with the zipped binaries.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      # unsafeptr is off: Win32/COM calls convert uintptr results to pointers by design.
      - name: go vet
        run: go vet -unsafeptr=false ./...

      - name: go test
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # Same two binaries as build.cmd; the icon resource (rsrc_windows_amd64.syso) is committed.
      - name: Build
        shell: bash
        run: |
          ldflags="-s -w -X main.version=$VERSION"
          go build -trimpath -ldflags "-H=windowsgui $ldflags" -o dist/maxmix.exe .
          go build -trimpath -ldflags "$ldflags" -o dist/maxmixc.exe .
          cp README.md dist/
          ./dist/maxmixc.exe version

      - name: Package
        shell: pwsh
        run: |
          $zip = "maxmix-$env:VERSION-windows-amd64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")

      - uses: actions/upload-artifact@v7
        with:
          name: maxmix-${{ env.VERSION }}
          path: |
            maxmix-*.zip
            maxmix-*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "maxmix $GITHUB_REF_NAME" \
            --generate-notes
